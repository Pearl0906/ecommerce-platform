resources:
  jobs:
    ecommerce_pipeline:
      name: ecommerce_pipeline

      tasks:

        - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/bronze/ingestion.ipynb
            warehouse_id: ${var.warehouse_id}

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/silver/data_cleaning.ipynb
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_customer_engagement
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/gold/customer_engagement.ipynb
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_customer_summary
          depends_on:
            - task_key: gold_customer_engagement
          notebook_task:
            notebook_path: ../notebooks/gold/customer_summary.ipynb
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_product_performance
          depends_on:
            - task_key: gold_customer_summary
          notebook_task:
            notebook_path: ../notebooks/gold/product_performance.ipynb
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_review_summary
          depends_on:
            - task_key: gold_product_performance
          notebook_task:
            notebook_path: ../notebooks/gold/review_summary.ipynb
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_sales_summary
          depends_on:
            - task_key: gold_review_summary
          notebook_task:
            notebook_path: ../notebooks/gold/sales_summary.ipynb
            warehouse_id: ${var.warehouse_id}
       